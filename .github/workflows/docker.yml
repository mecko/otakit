name: Docker

# Builds the console image (docker/console.Dockerfile) for amd64 and arm64 on
# native runners and publishes one multi-arch tag to GHCR. Pull requests build
# without pushing. docker/compose.yaml pulls the published image.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'packages/console/**'
      - 'packages/mcp-core/**'
      - 'packages/push-server/**'
      - 'scripts/generate-llms-txt.mjs'
      - 'packages/site/app/docs/**'
      - 'packages/site/lib/changelog.json'
      - 'pnpm-lock.yaml'
      - 'docker/console.Dockerfile*'
      - 'docker/init-env.mjs'
      - 'docker/.env.example'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'packages/console/**'
      - 'packages/mcp-core/**'
      - 'packages/push-server/**'
      - 'scripts/generate-llms-txt.mjs'
      - 'packages/site/app/docs/**'
      - 'packages/site/lib/changelog.json'
      - 'pnpm-lock.yaml'
      - 'docker/console.Dockerfile*'
      - 'docker/init-env.mjs'
      - 'docker/.env.example'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: otakit-console

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image reference
        id: ref
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          platform='${{ matrix.platform }}'
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/console.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=console-${{ steps.ref.outputs.pair }}
          cache-to: type=gha,mode=max,scope=console-${{ steps.ref.outputs.pair }}
          outputs: >-
            ${{ github.event_name == 'pull_request'
              && 'type=cacheonly'
              || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.ref.outputs.image) }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ steps.ref.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch tag
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image reference
        id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest = main; v1.2.3 tags also publish 1.2.3 and 1.2; every build gets sha-<short>.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ref.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.ref.outputs.image }}@sha256:%s ' *)
